name: Module 1 offline smoke
on:
  push:
    paths: ['01-consistent-media-generation-on-serverless-gpus/**', 'tests/test_module1_smoke.py', 'pyproject.toml', '.github/workflows/module-1-smoke.yml']
  pull_request:
    paths: ['01-consistent-media-generation-on-serverless-gpus/**', 'tests/test_module1_smoke.py', 'pyproject.toml', '.github/workflows/module-1-smoke.yml']
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests/test_module1_smoke.py -v
